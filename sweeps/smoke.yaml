# smoke sweep - 1 frame per operator on the 3 real cubes, ~1 min. --cube <key> for just one
cubes:
  l1448: data/l1448_13co.fits
  j1615: data/exoalma_j1615_12co.fits
  ngc2403: data/things_ngc2403_hi.fits
out: results/smoke
decoder: {mode: blind, recipe: jnd, jnd: 2.9}     # bujack 2026 bins, see docs/metrics.md
vis_jnd: 2.3          # flux visible = 1 JND from the legends zero color
controls: {beam_fwhm_px: 2.0}   # l1448: 46 arcsec beam / 23 arcsec px
operators:
  - {name: clip}
  - {name: log}
  - {name: asinh}
  - {name: threshold}
  - {name: absorb, params: {tau: 0.35}}
  - {name: absorb, params: {tau: 1.5}}
  - {name: mip}
  - {name: colormap, params: {cmap: inferno}}
  - {name: colormap, params: {cmap: jet}}
  - {name: grade_teal_orange}
  - {name: grade_nonmonotone}
  - {name: orbit, params: {theta: 30, aspect: 1}}
  - {name: orbit, params: {theta: 30, aspect: 3}}
  - {name: dof}
  - {name: shading}
  - {name: bloom}
  - {name: vignette}
